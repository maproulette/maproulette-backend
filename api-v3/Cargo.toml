[package]
name = "maproulette-backend"
edition = "2024"
rust-version = "1.94"

[lib]
name = "maproulette"

[dependencies]
anyhow = "1.0.104"
async-compression = { version = "0.4.51", features = ["tokio", "gzip"] }
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
crc32fast = "1.5.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hmac = "0.13.0"
http-body = "1.1.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "json", "time", "tls-rustls"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "time"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
flate2 = "1.1.10"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tower = { version = "0.5.3", features = ["util"] }
